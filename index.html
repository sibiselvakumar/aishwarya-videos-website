      <script>try { Typekit.load({ async: false }) } catch (e) {}</script>
    -->
    <!-- EB Garamond is the free stand-in until that kit is enabled -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap"
